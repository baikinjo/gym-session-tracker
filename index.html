<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Gym Session Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d16;
      --panel: #111827;
      --panel-2: #182235;
      --line: #2a3850;
      --text: #f8fafc;
      --muted: #9fb0c8;
      --accent: #a3e635;
      --accent-dark: #1f2c17;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom));
    }

    header {
      position: sticky;
      top: calc(env(safe-area-inset-top) + 8px);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(17, 24, 39, .96);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 2px; font-size: 1.45rem; }
    h2 { margin-bottom: 12px; font-size: 1.1rem; }
    .muted { color: var(--muted); }
    .small { font-size: .82rem; }

    .card {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .grid > * { min-width: 0; }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 650;
    }

    input, select, textarea {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      min-height: 42px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #0c1321;
      color: var(--text);
      font-size: 16px;
    }

    input[type="date"] {
      display: block;
      min-width: 0;
      overflow: hidden;
      -webkit-appearance: none;
      appearance: none;
      text-align: left;
    }

    input[type="date"]::-webkit-date-and-time-value {
      margin: 0;
      text-align: left;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 72px; resize: vertical; }

    button {
      min-height: 42px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel-2);
      color: var(--text);
      font-weight: 750;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #15200c;
    }

    button.danger { color: var(--danger); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .timer {
      color: var(--accent);
      font-size: 1.45rem;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .timer-stack { text-align: right; }

    .rest-timer {
      margin-top: 2px;
      color: var(--muted);
      font-size: .78rem;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      white-space: nowrap;
    }

    .rest-timer.active { color: var(--accent); }
    .rest-timer.complete { color: #67e8f9; }

    .rest-clear {
      min-height: 0;
      margin-top: 3px;
      padding: 2px 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: .7rem;
    }

    .exercise {
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #0c1321;
    }

    .exercise:last-child { margin-bottom: 0; }

    .exercise-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .exercise-name { font-weight: 800; }
    .target { color: var(--accent); font-size: .78rem; white-space: nowrap; }
    .previous { margin-top: 3px; color: var(--muted); font-size: .75rem; }

    .set-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) repeat(var(--set-count), minmax(0, .7fr)) minmax(0, .7fr);
      gap: 6px;
      align-items: end;
    }

    .set-grid label { text-align: center; }
    .set-grid input { min-width: 0; padding-inline: 6px; text-align: center; }
    .set-grid label:first-child { text-align: left; }

    .set-actions {
      display: grid;
      grid-template-columns: repeat(var(--set-count), minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }

    .set-actions button {
      min-height: 36px;
      padding: 6px;
      font-size: .76rem;
    }

    .set-actions button.completed {
      border-color: var(--accent);
      background: var(--accent-dark);
      color: var(--accent);
    }

    .summary {
      display: none;
      background: #fff;
      color: #111827;
    }

    .summary.visible { display: block; }
    .summary .muted { color: #526079; }

    .summary-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 2px solid #111827;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .summary h2 { margin-bottom: 2px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .74rem;
    }

    th, td {
      padding: 5px 3px;
      border-bottom: 1px solid #d9dee7;
      text-align: center;
    }

    th:first-child, td:first-child { text-align: left; }

    .summary-notes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 9px;
      font-size: .74rem;
    }

    .summary-notes div {
      padding: 7px;
      border-radius: 8px;
      background: #eef2f7;
    }

    .hidden { display: none !important; }

    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.3rem; }
      .set-grid {
        grid-template-columns: minmax(0, 1.2fr) repeat(var(--set-count), minmax(0, .72fr)) minmax(0, .72fr);
      }
      .app { padding-inline: 10px; }
      .card { padding: 11px; }
    }

    @media print {
      body { background: #fff; }
      .app { width: 100%; padding: 0; }
      header { position: static; }
      body.summary-mode > .app > :not(.summary) { display: none !important; }
      .summary { display: block; border: 0; margin: 0; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Gym Session Tracker</h1>
        <div class="muted small">Autosaves on this device</div>
      </div>
      <div class="timer-stack">
        <div id="timer" class="timer">00:00:00</div>
        <div id="restTimer" class="rest-timer">No rest timer</div>
        <button id="restClear" class="rest-clear hidden">Clear rest timer</button>
      </div>
    </header>

    <section class="card">
      <div class="grid">
        <label>
          Session
          <select id="sessionType">
            <option value="A">Full Body A - Tuesday</option>
            <option value="B">Full Body B - Thursday</option>
          </select>
        </label>
        <label>
          Training phase
          <select id="phase">
            <option value="week1">Week 1: priming</option>
            <option value="week2">Week 2: restore two sets</option>
            <option value="week3">Week 3: volume ramp</option>
            <option value="normal" selected>Normal training</option>
            <option value="taper">Optional 5K taper - gate passed</option>
          </select>
        </label>
        <label>
          Date
          <input id="sessionDate" type="date">
        </label>
        <label>
          Session RPE
          <input id="sessionRpe" type="number" min="1" max="10" inputmode="numeric" placeholder="1-10">
        </label>
      </div>
      <div class="actions" style="margin-top: 10px">
        <button id="timerToggle" class="primary">Start timer</button>
        <button id="timerReset">Reset timer</button>
      </div>
    </section>

    <section class="card">
      <h2 id="sessionTitle">Full Body A - Tuesday</h2>
      <p id="phaseNote" class="muted small"></p>
      <div id="exerciseList"></div>
    </section>

    <section class="card">
      <h2>Session notes</h2>
      <div class="grid">
        <label>
          Readiness / prior run
          <input id="readiness" placeholder="Normal, tired, prior run effect">
        </label>
        <label>
          Pain or soreness
          <input id="pain" placeholder="None, location and severity">
        </label>
      </div>
      <label style="margin-top: 10px">
        Notes
        <textarea id="sessionNotes" placeholder="Technique, equipment, unusual fatigue..."></textarea>
      </label>
    </section>

    <section class="card">
      <div class="actions">
        <button id="finish" class="primary">Finish and show summary</button>
        <button id="saveSession">Save completed session</button>
        <button id="newSession" class="danger">Clear draft</button>
      </div>
      <p class="muted small" style="margin: 10px 0 0">
        Save only after the workout is complete. The latest matching session appears as “Previous” above each exercise.
      </p>
    </section>

    <section id="summary" class="card summary" aria-live="polite">
      <div class="summary-header">
        <div>
          <h2 id="summaryTitle"></h2>
          <div id="summaryDate" class="muted small"></div>
        </div>
        <div style="text-align:right">
          <strong id="summaryDuration"></strong>
          <div id="summaryRpe" class="muted small"></div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Exercise</th>
            <th>Weight (lb)</th>
            <th>S1</th>
            <th>S2</th>
            <th>S3</th>
            <th>RIR</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
      <div class="summary-notes">
        <div><strong>Readiness</strong><br><span id="summaryReadiness"></span></div>
        <div><strong>Pain/soreness</strong><br><span id="summaryPain"></span></div>
        <div style="grid-column: 1 / -1"><strong>Notes</strong><br><span id="summaryNotes"></span></div>
      </div>
    </section>

    <section class="card">
      <h2>Backup</h2>
      <div class="actions">
        <button id="exportData">Export JSON</button>
        <button id="importData">Import JSON</button>
        <input id="importFile" class="hidden" type="file" accept="application/json">
      </div>
    </section>
  </main>

  <script>
    const programId = "fresh-start-2026";
    const phases = {
      week1: {
        note: "Keep 4-5 RIR, start about 20-30% below known prior loads, and do not progress."
      },
      week2: {
        note: "Use 2 sets for every exercise at 3-4 RIR. Hold the load if Week 1 caused more than mild soreness."
      },
      week3: {
        note: "Use 3 RIR for compounds and 2-3 RIR for accessories."
      },
      normal: {
        note: "Use the listed sets and RIR. Keep the same exercise roster through Cycle 4 and use double progression after two consecutive top-of-range exposures. Substitute only for pain, equipment limits, poor movement fit, or a three-exposure stall."
      },
      taper: {
        note: "Use only after the optional 5K gate passes and the athlete chooses the benchmark. Tuesday Full Body A uses 1-2 sets at 4 RIR with no more than the prior load. Thursday Full Body B is skipped."
      }
    };

    const plans = {
      A: {
        title: "Full Body A - Tuesday",
        exercises: [
          {
            name: "Smith or barbell squat",
            reps: "6-10",
            sets: 3,
            rir: "2-3",
            alternative: "Leg press",
            rest: "2-3 min",
            restSeconds: 180,
            kind: "lower-compound"
          },
          {
            name: "Dumbbell or Smith bench press",
            reps: "6-10",
            sets: 3,
            rir: "1-3",
            alternative: "Machine chest press",
            rest: "2 min",
            restSeconds: 120,
            kind: "compound"
          },
          {
            name: "Chest-supported dumbbell or machine row",
            reps: "8-12",
            sets: 3,
            rir: "1-3",
            alternative: "Seated cable row",
            rest: "2 min",
            restSeconds: 120,
            kind: "compound"
          },
          {
            name: "Smith or dumbbell Romanian deadlift",
            reps: "8-10",
            sets: 3,
            rir: "2-3",
            alternative: "Machine leg curl",
            rest: "2-3 min",
            restSeconds: 180,
            kind: "lower-compound"
          },
          {
            name: "Dumbbell or cable lateral raise",
            reps: "12-20",
            sets: 2,
            rir: "1-3",
            alternative: "Machine lateral raise",
            rest: "60-90 sec",
            restSeconds: 90,
            kind: "accessory"
          },
          {
            name: "Standing calf raise",
            reps: "10-20",
            sets: 2,
            rir: "1-3",
            alternative: "Leg-press calf raise",
            rest: "60-90 sec",
            restSeconds: 90,
            kind: "accessory"
          }
        ]
      },
      B: {
        title: "Full Body B - Thursday",
        exercises: [
          {
            name: "Leg press",
            reps: "8-12",
            sets: 3,
            rir: "2-3",
            alternative: "Bulgarian split squat",
            rest: "2-3 min",
            restSeconds: 180,
            kind: "lower-compound"
          },
          {
            name: "Incline dumbbell press",
            reps: "8-12",
            sets: 3,
            rir: "1-3",
            alternative: "Smith incline press",
            rest: "2 min",
            restSeconds: 120,
            kind: "compound"
          },
          {
            name: "Lat pulldown",
            reps: "8-12",
            sets: 3,
            rir: "1-3",
            alternative: "Assisted pull-up",
            rest: "2 min",
            restSeconds: 120,
            kind: "compound"
          },
          {
            name: "Machine leg curl",
            reps: "10-15",
            sets: 3,
            rir: "2-3",
            alternative: "Light dumbbell Romanian deadlift",
            rest: "90-120 sec",
            restSeconds: 120,
            kind: "lower-compound"
          },
          {
            name: "Seated dumbbell shoulder press",
            reps: "8-12",
            sets: 2,
            rir: "1-3",
            alternative: "Machine shoulder press",
            rest: "90 sec",
            restSeconds: 90,
            kind: "compound"
          },
          {
            name: "Dumbbell/cable curl",
            reps: "10-15",
            sets: 2,
            rir: "1-3",
            alternative: "Machine curl",
            rest: "60-90 sec",
            restSeconds: 90,
            kind: "accessory"
          },
          {
            name: "Cable triceps pressdown",
            reps: "10-15",
            sets: 2,
            rir: "1-3",
            alternative: "Dumbbell overhead extension",
            rest: "60-90 sec",
            restSeconds: 90,
            kind: "accessory"
          },
          {
            name: "Seated calf raise",
            reps: "10-20",
            sets: 2,
            rir: "1-3",
            alternative: "Standing calf raise",
            rest: "60 sec",
            restSeconds: 60,
            kind: "accessory"
          },
          {
            name: "Plank, cable crunch, or ab wheel",
            reps: "Controlled",
            sets: 2,
            rir: "2-3",
            alternative: "Any controlled trunk exercise",
            rest: "60 sec",
            restSeconds: 60,
            kind: "accessory"
          }
        ]
      }
    };

    const legacyExerciseNames = {
      "Dumbbell or cable lateral raise": ["Dumbbell lateral raise"],
      "Lat pulldown": ["Lat pulldown or machine row"]
    };
    const draftKey = "gym-tracker-draft-v2";
    const historyKey = "gym-tracker-history-v1";
    const timerKey = "gym-tracker-timer-v1";
    const restKey = "gym-tracker-rest-v1";
    const $ = (id) => document.getElementById(id);
    const text = (value, fallback = "-") => String(value || "").trim() || fallback;

    let timerState = JSON.parse(localStorage.getItem(timerKey) || '{"running":false,"elapsed":0,"startedAt":null}');
    let restState = JSON.parse(localStorage.getItem(restKey) || '{"endAt":null,"label":"","displayLabel":"","notified":false}');

    function today() {
      const date = new Date();
      return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function currentElapsed() {
      if (!timerState.running) return timerState.elapsed;
      return timerState.elapsed + Date.now() - timerState.startedAt;
    }

    function formatDuration(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const hours = String(Math.floor(total / 3600)).padStart(2, "0");
      const minutes = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
      const seconds = String(total % 60).padStart(2, "0");
      return `${hours}:${minutes}:${seconds}`;
    }

    function updateTimer() {
      $("timer").textContent = formatDuration(currentElapsed());
      $("timerToggle").textContent = timerState.running ? "Pause timer" : "Start timer";
    }

    function updateRestTimer() {
      if (!restState.endAt) {
        $("restTimer").textContent = "No rest timer";
        $("restTimer").className = "rest-timer";
        $("restClear").classList.add("hidden");
        return;
      }

      const remaining = Math.max(0, restState.endAt - Date.now());
      const legacySet = String(restState.label || "").match(/S(\d+)$/);
      const displayLabel = restState.displayLabel || (legacySet ? `S${legacySet[1]} rest` : restState.label);
      $("restClear").classList.remove("hidden");
      if (remaining > 0) {
        $("restTimer").textContent = `${displayLabel}: ${formatDuration(remaining).slice(3)}`;
        $("restTimer").className = "rest-timer active";
        return;
      }

      $("restTimer").textContent = `${displayLabel}: complete`;
      $("restTimer").className = "rest-timer complete";
      if (!restState.notified) {
        restState.notified = true;
        localStorage.setItem(restKey, JSON.stringify(restState));
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    }

    function startRest(exerciseIndex, setIndex) {
      const plan = plans[draft.type].exercises[exerciseIndex];
      const seconds = plan.restSeconds;
      const exercise = draft.exercises[exerciseIndex];
      exercise.done = exercise.done || [false, false, false];
      exercise.done[setIndex] = true;
      restState = {
        endAt: Date.now() + seconds * 1000,
        label: `${exercise.name} S${setIndex + 1}`,
        displayLabel: `S${setIndex + 1} rest`,
        notified: false
      };
      localStorage.setItem(restKey, JSON.stringify(restState));
      saveDraft();
      renderExercises();
      updateRestTimer();
    }

    function toggleSetCompletion(exerciseIndex, setIndex) {
      const exercise = draft.exercises[exerciseIndex];
      exercise.done = exercise.done || [false, false, false];

      if (exercise.done[setIndex]) {
        exercise.done[setIndex] = false;
        if (restState.label === `${exercise.name} S${setIndex + 1}`) clearRestTimer();
        saveDraft();
        renderExercises();
        return;
      }

      startRest(exerciseIndex, setIndex);
    }

    function clearRestTimer() {
      restState = { endAt: null, label: "", displayLabel: "", notified: false };
      localStorage.setItem(restKey, JSON.stringify(restState));
      updateRestTimer();
    }

    function persistTimer() {
      localStorage.setItem(timerKey, JSON.stringify(timerState));
      updateTimer();
    }

    function toggleTimer() {
      if (timerState.running) {
        timerState.elapsed = currentElapsed();
        timerState.running = false;
        timerState.startedAt = null;
      } else {
        timerState.running = true;
        timerState.startedAt = Date.now();
      }
      persistTimer();
    }

    function resetTimer() {
      timerState = { running: false, elapsed: 0, startedAt: null };
      persistTimer();
    }

    function history() {
      return JSON.parse(localStorage.getItem(historyKey) || "[]");
    }

    function formatWeight(value, fallback = "-") {
      const raw = String(value || "").trim();
      if (!raw) return fallback;
      const numeric = raw.match(/^(\d+(?:\.\d+)?)\s*(?:lb|lbs)?$/i);
      return numeric ? `${numeric[1]} lb` : raw;
    }

    function previousExercise(name) {
      const matchingNames = new Set([name, ...(legacyExerciseNames[name] || [])]);
      for (const entry of history()) {
        const exercise = entry.exercises?.find((item) => matchingNames.has(item.name));
        if (exercise) return exercise;
      }
      return null;
    }

    function blankExercise({ name }) {
      return { name, load: "", reps: ["", "", ""], rir: "", notes: "", done: [false, false, false] };
    }

    function defaultDraft(type = "A") {
      return {
        programId,
        type,
        phase: "normal",
        date: today(),
        sessionRpe: "",
        readiness: "",
        pain: "",
        notes: "",
        exercises: plans[type].exercises.map(blankExercise)
      };
    }

    function loadDraft() {
      const saved = JSON.parse(localStorage.getItem(draftKey) || "null");
      if (!saved || saved.programId !== programId || !plans[saved.type]) return defaultDraft();

      return {
        ...saved,
        programId,
        phase: phases[saved.phase] ? saved.phase : "normal",
        exercises: plans[saved.type].exercises.map((planExercise) => {
          const existing = saved.exercises?.find((exercise) => exercise.name === planExercise.name) || {};
          return {
            ...blankExercise(planExercise),
            ...existing,
            name: planExercise.name,
            reps: Array.isArray(existing.reps) ? existing.reps : ["", "", ""],
            done: Array.isArray(existing.done) ? existing.done : [false, false, false]
          };
        })
      };
    }

    let draft = loadDraft();

    function activeSetCount(exerciseIndex) {
      const exercise = plans[draft.type].exercises[exerciseIndex];
      if (draft.phase === "week1") return exercise.kind === "lower-compound" ? 1 : 2;
      if (draft.phase === "week2") return 2;
      if (draft.phase === "week3") return exercise.kind === "lower-compound" ? 2 : exercise.sets;
      if (draft.phase === "taper") return draft.type === "A" ? Math.min(2, exercise.sets) : 0;
      return exercise.sets;
    }

    function targetRir(exercise) {
      if (draft.phase === "week1") return "4-5";
      if (draft.phase === "week2") return "3-4";
      if (draft.phase === "week3") return exercise.kind === "accessory" ? "2-3" : "3";
      if (draft.phase === "taper") return "4";
      return exercise.rir;
    }

    function sessionIsSkipped() {
      return draft.phase === "taper" && draft.type === "B";
    }

    function currentPhaseNote() {
      const lowerBodyExercises = draft.type === "A"
        ? "Squat and Romanian deadlift"
        : "Leg press and leg curl";
      if (draft.phase === "week1") {
        return `${lowerBodyExercises}: 1 set. All others: 2 sets. ${phases.week1.note}`;
      }
      if (draft.phase === "week3") {
        return `${lowerBodyExercises}: 2 sets. Use listed sets for all others. ${phases.week3.note}`;
      }
      return phases[draft.phase].note;
    }

    function renderExercises() {
      $("sessionTitle").textContent = plans[draft.type].title;
      $("phaseNote").textContent = currentPhaseNote();
      if (sessionIsSkipped()) {
        $("exerciseList").innerHTML = '<p class="muted">No exercises are scheduled. Thursday is complete rest during the running time-trial week.</p>';
        return;
      }

      $("exerciseList").innerHTML = draft.exercises.map((exercise, index) => {
        const exercisePlan = plans[draft.type].exercises[index];
        const prior = previousExercise(exercise.name);
        const priorText = prior
          ? `${formatWeight(prior.load)} · ${prior.reps.filter(Boolean).join("/")} reps · RIR ${text(prior.rir)}`
          : "No prior session";
        const setCount = activeSetCount(index);
        const repTarget = exercisePlan.reps === "Controlled" ? exercisePlan.reps : `${exercisePlan.reps} reps`;
        return `
          <div class="exercise" data-index="${index}">
            <div class="exercise-head">
              <div>
                <div class="exercise-name">${exercise.name}</div>
                <div class="previous">Alternative: ${exercisePlan.alternative}</div>
                <div class="previous">Previous: ${priorText}</div>
              </div>
              <div class="target">${repTarget} · ${targetRir(exercisePlan)} RIR<br>Rest ${exercisePlan.rest}</div>
            </div>
            <div class="set-grid" style="--set-count: ${setCount}">
              <label>Weight (lb)<input data-field="load" inputmode="decimal" value="${exercise.load}" placeholder="0"></label>
              ${[0, 1, 2].map((set) => `
                <label class="${set >= setCount ? "hidden" : ""}">S${set + 1}
                  <input data-rep="${set}" type="number" min="0" inputmode="numeric" value="${exercise.reps[set]}" placeholder="-">
                </label>
              `).join("")}
              <label>RIR<input data-field="rir" type="number" min="0" max="10" inputmode="numeric" value="${exercise.rir}" placeholder="${targetRir(exercisePlan)}"></label>
            </div>
            <div class="set-actions" style="--set-count: ${setCount}">
              ${[0, 1, 2].map((set) => `
                <button
                  class="${set >= setCount ? "hidden" : ""} ${exercise.done?.[set] ? "completed" : ""}"
                  data-finish-set="${set}"
                  type="button"
                >${exercise.done?.[set] ? `Undo S${set + 1}` : `Finish S${set + 1}`}</button>
              `).join("")}
            </div>
            <label style="margin-top:8px">Exercise notes
              <input data-field="notes" value="${exercise.notes}" placeholder="Form, setup, pain...">
            </label>
          </div>
        `;
      }).join("");
    }

    function syncForm() {
      $("sessionType").value = draft.type;
      $("phase").value = draft.phase;
      $("sessionDate").value = draft.date;
      $("sessionRpe").value = draft.sessionRpe;
      $("readiness").value = draft.readiness;
      $("pain").value = draft.pain;
      $("sessionNotes").value = draft.notes;
      renderExercises();
    }

    function saveDraft() {
      localStorage.setItem(draftKey, JSON.stringify(draft));
    }

    function changeSession(type) {
      const phase = draft.phase;
      draft = defaultDraft(type);
      draft.phase = phase;
      saveDraft();
      syncForm();
      hideSummary();
    }

    function collectSummary() {
      if (sessionIsSkipped()) {
        alert("Full Body B is skipped during the running time-trial week.");
        return;
      }

      const elapsed = currentElapsed();
      $("summaryTitle").textContent = plans[draft.type].title;
      $("summaryDate").textContent = draft.date;
      $("summaryDuration").textContent = formatDuration(elapsed);
      $("summaryRpe").textContent = `Session RPE: ${text(draft.sessionRpe)}`;
      $("summaryReadiness").textContent = text(draft.readiness);
      $("summaryPain").textContent = text(draft.pain, "None reported");
      $("summaryNotes").textContent = text(draft.notes);
      $("summaryBody").innerHTML = draft.exercises.map((exercise, index) => {
        const setCount = activeSetCount(index);
        const reps = exercise.reps.map((rep, set) => set < setCount ? text(rep) : "-");
        return `
          <tr>
            <td>${exercise.name}</td>
            <td>${formatWeight(exercise.load)}</td>
            <td>${reps[0]}</td>
            <td>${reps[1]}</td>
            <td>${reps[2]}</td>
            <td>${text(exercise.rir)}</td>
          </tr>
        `;
      }).join("");
      $("summary").classList.add("visible");
      $("summary").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function hideSummary() {
      $("summary").classList.remove("visible");
    }

    function saveCompletedSession() {
      if (sessionIsSkipped()) {
        alert("Full Body B is skipped during the running time-trial week.");
        return;
      }

      const completed = {
        ...draft,
        durationMs: currentElapsed(),
        savedAt: new Date().toISOString()
      };
      const updated = [completed, ...history()].slice(0, 100);
      localStorage.setItem(historyKey, JSON.stringify(updated));
      collectSummary();
      alert("Session saved on this device.");
    }

    function clearDraft() {
      if (!confirm("Clear the current draft and timer?")) return;
      draft = defaultDraft(draft.type);
      localStorage.setItem(draftKey, JSON.stringify(draft));
      resetTimer();
      clearRestTimer();
      syncForm();
      hideSummary();
    }

    function exportData() {
      const data = {
        programId,
        exportedAt: new Date().toISOString(),
        draft,
        history: history()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `gym-tracker-${today()}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    async function importData(file) {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.history) || !data.draft) throw new Error("Invalid backup file");
      localStorage.setItem(historyKey, JSON.stringify(data.history));
      const currentDraft = data.draft.programId === programId && plans[data.draft.type];
      if (currentDraft) {
        localStorage.setItem(draftKey, JSON.stringify(data.draft));
      } else {
        localStorage.removeItem(draftKey);
      }
      draft = loadDraft();
      syncForm();
      alert(currentDraft ? "Backup imported." : "History imported. The retired-program draft was not restored.");
    }

    $("timerToggle").addEventListener("click", toggleTimer);
    $("timerReset").addEventListener("click", resetTimer);
    $("restClear").addEventListener("click", clearRestTimer);
    $("finish").addEventListener("click", collectSummary);
    $("saveSession").addEventListener("click", saveCompletedSession);
    $("newSession").addEventListener("click", clearDraft);
    $("exportData").addEventListener("click", exportData);
    $("importData").addEventListener("click", () => $("importFile").click());
    $("importFile").addEventListener("change", (event) => {
      const [file] = event.target.files;
      if (file) importData(file).catch((error) => alert(error.message));
      event.target.value = "";
    });

    $("sessionType").addEventListener("change", (event) => changeSession(event.target.value));
    $("phase").addEventListener("change", (event) => {
      draft.phase = event.target.value;
      saveDraft();
      renderExercises();
    });

    [
      ["sessionDate", "date"],
      ["sessionRpe", "sessionRpe"],
      ["readiness", "readiness"],
      ["pain", "pain"],
      ["sessionNotes", "notes"]
    ].forEach(([id, field]) => {
      $(id).addEventListener("input", (event) => {
        draft[field] = event.target.value;
        saveDraft();
      });
    });

    $("exerciseList").addEventListener("input", (event) => {
      const exerciseElement = event.target.closest(".exercise");
      if (!exerciseElement) return;
      const exercise = draft.exercises[Number(exerciseElement.dataset.index)];
      if (event.target.dataset.field) exercise[event.target.dataset.field] = event.target.value;
      if (event.target.dataset.rep !== undefined) exercise.reps[Number(event.target.dataset.rep)] = event.target.value;
      saveDraft();
    });

    $("exerciseList").addEventListener("click", (event) => {
      const button = event.target.closest("[data-finish-set]");
      if (!button) return;
      const exerciseElement = button.closest(".exercise");
      toggleSetCompletion(Number(exerciseElement.dataset.index), Number(button.dataset.finishSet));
    });

    setInterval(() => {
      updateTimer();
      updateRestTimer();
    }, 1000);
    syncForm();
    updateTimer();
    updateRestTimer();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
